services:
  # ---------- 后端（24小时在线 Node 服务） ----------
  - type: web
    name: zhewei-geo-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    plan: free
    envVars:
      - key: SANDBOX_MODE
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-v4-flash

  # ---------- 前端（静态站，自动构建 dist） ----------
  - type: web
    name: zhewei-geo-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
